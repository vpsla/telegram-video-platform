[project]
name = "telegram-video-platform"
version = "0.1.0"
description = "YouTube-like video platform backed by Telegram Channel storage"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "aiogram>=3.15,<4.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.28,<1.0",
    "redis>=5.2,<6.0",
    "uvicorn[standard]>=0.32,<1.0",
    "fastapi>=0.115,<1.0",
    "python-json-logger>=3.2,<4.0",
    "tenacity>=9.0,<10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1.0",
    "black>=24.10,<25.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "aiosqlite>=0.20,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",              # isort
    "UP",             # pyupgrade
    "B",              # bugbear
    "C4",             # comprehensions
    "SIM",            # simplify
    "RUF",            # ruff-specific
]
ignore = ["E501"]  # line length handled by black

