name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"

      - name: Set up Python + venv
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv venv .venv --python ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Run ruff
        run: .venv/bin/ruff check app tests

      - name: Run black --check
        run: .venv/bin/black --check app tests

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"

      - name: Set up Python + venv
        run: |
          uv python install ${{ env.PYTHON_VERSION }}
          uv venv .venv --python ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Run pytest
        env:
          ENVIRONMENT: local
          DEBUG: "true"
          LOG_LEVEL: INFO
          TELEGRAM_BOT_TOKEN: "000000:TEST-TOKEN-NOT-REAL"
          TELEGRAM_STORAGE_CHANNEL_ID: "-1001111111111"
          TELEGRAM_WEBHOOK_BASE_URL: "https://example.com"
          TELEGRAM_WEBHOOK_SECRET_TOKEN: "test-secret"
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test_db"
        run: .venv/bin/pytest

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: telegram-video-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
